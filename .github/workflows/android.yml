name: android-apk
# Builds the Android APK on a GitHub runner (the authoring environment has no Android SDK).
# Run manually: Actions, android-apk, Run workflow. The APK is attached to the run as an artifact.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Gradle variant'
        default: 'Release'
        type: choice
        options: [Release, Debug]
      demo_mode:
        description: 'Build in DEMO MODE (offline, simulated restrictions, no backend)'
        default: true
        type: boolean
  push:
    branches: ['claude/**']
    paths: ['apps/mobile/**', '!apps/mobile/e2e/**', 'packages/**', '.github/workflows/android.yml', 'pnpm-lock.yaml']

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install SDK components (the runner image ships the SDK at ANDROID_HOME)
        run: |
          SDKM="$(find "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}/cmdline-tools" -name sdkmanager -type f | head -1)"
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" --install "platforms;android-37" "build-tools;37.0.0" "ndk;27.1.12297006" "cmake;3.22.1" | tail -3
      - run: pnpm install --frozen-lockfile
      - name: Client environment (public values only, none needed in demo mode)
        run: |
          echo "DEMO_MODE=${{ (github.event.inputs.demo_mode || 'true') == 'true' && '1' || '' }}" > apps/mobile/.env
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        working-directory: apps/mobile/android
        run: ./gradlew assemble${{ github.event.inputs.variant || 'Release' }} -PreactNativeArchitectures=arm64-v8a,x86_64 --stacktrace
      - name: Collect APK
        run: |
          mkdir -p out && find apps/mobile/android/app/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          ls -la out
      - name: Inspect the APK (permissions and bundle contents)
        run: |
          APK=$(ls out/*.apk | head -1)
          AAPT2="$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort | tail -1)"
          "$AAPT2" dump permissions "$APK" | tee perms.txt
          if grep -q QUERY_ALL_PACKAGES perms.txt; then echo "FAIL: QUERY_ALL_PACKAGES must not be requested"; exit 1; fi
          for p in PACKAGE_USAGE_STATS SYSTEM_ALERT_WINDOW FOREGROUND_SERVICE_SPECIAL_USE; do grep -q "$p" perms.txt || { echo "missing $p"; exit 1; }; done
          unzip -p "$APK" assets/index.android.bundle > bundle.hbc
          if [ "${{ (github.event.inputs.demo_mode || 'true') }}" = "true" ]; then
            grep -qa "Social feed (demo)" bundle.hbc && echo "demo bundle: demo content present (expected)"
          else
            if grep -qa "only begotten Son" bundle.hbc; then echo "FAIL: non-demo bundle contains placeholder scripture"; exit 1; fi
            echo "non-demo bundle: no placeholder scripture"
          fi
          "$AAPT2" dump badging "$APK" | grep -E "package:|sdkVersion|targetSdkVersion|native-code" | head
      - uses: actions/upload-artifact@v4
        with:
          name: rabbai-android-apk
          path: out/*.apk
          if-no-files-found: error

  emulator-smoke:
    needs: apk
    # Installs the CI-built demo APK on an Android emulator, launches it and runs the demo journey with Maestro.
    if: ${{ (github.event.inputs.demo_mode || 'true') == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: rabbai-android-apk, path: out }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          ram-size: 4096M
          cores: 4
          script: bash apps/mobile/e2e/run-smoke.sh out/app-release.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-smoke-results
          path: |
            launch.png
            screenshots/*.png
            maestro-report.xml
            ~/.maestro/tests/**
          if-no-files-found: ignore
