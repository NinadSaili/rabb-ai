# Maestro flow for the DEMO MODE build (apk built with DEMO_MODE=1). Run by the emulator-smoke job in .github/workflows/android.yml.
# The same journey is also covered by src/__tests__/demoJourney.test.tsx (Jest).
# Run on a device: maestro test apps/mobile/e2e/demo-journey.yaml
appId: com.rabbai.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "DEMO MODE.*"
    timeout: 30000
- extendedWaitUntil:
    visible: "Before the scroll, seek the Word."
    timeout: 30000
- tapOn: "I am 13 or older"
- tapOn: "Begin"
- extendedWaitUntil:
    visible: "Choose a Bible translation"
    timeout: 30000
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Today's verse"
    timeout: 30000
- tapOn: "Continue"
- tapOn: "Social feed \\(demo\\)"
- tapOn: "Short videos \\(demo\\)"
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "When should your ritual start?"
    timeout: 30000
- tapOn:
    text: "Reading timer.*"
- inputText: "30"
- hideKeyboard
- tapOn: "Save schedule"
- extendedWaitUntil:
    visible: "Restricted \\(simulated\\)"
    timeout: 30000
- tapOn: "Start ritual"
- tapOn: "I have read this"
- tapOn: "Amen"
- tapOn: "Start timer"
- extendedWaitUntil:
    visible:
      text: "Finish"
      enabled: true
    timeout: 60000
- tapOn: "Finish"
- extendedWaitUntil:
    visible: "Well done"
    timeout: 30000
- tapOn: "Unlock my apps"
- extendedWaitUntil:
    visible: "Unlocked \\(simulated\\).*"
    timeout: 30000
